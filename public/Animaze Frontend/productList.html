<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Animaze — Genre / Product Listing</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0c0c1e;
        --panel: #141426;
        --panel-2: #1e1a2c;
        --muted: #bdbbd1;
        --text: #f5f5f7;
        --primary: #5c3aff;
        --secondary: #ff3366;
        --accent: #00f6ff;
        --glass: rgba(255, 255, 255, 0.03);
        --radius: 14px;
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial;
      }
      body {
        background: radial-gradient(
            800px 300px at 8% -8%,
            rgba(92, 58, 255, 0.06),
            transparent
          ),
          radial-gradient(
            700px 250px at 110% 0%,
            rgba(0, 246, 255, 0.03),
            transparent
          ),
          var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding-bottom: 80px;
      }

      /* floating background blobs */
      .bg-layer {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.18;
        mix-blend-mode: screen;
      }
      .b1 {
        left: -8%;
        top: -8%;
        width: 520px;
        height: 520px;
        background: linear-gradient(
          135deg,
          rgba(92, 58, 255, 0.95),
          rgba(0, 246, 255, 0.55)
        );
        animation: b1 18s ease-in-out infinite;
      }
      .b2 {
        right: -12%;
        bottom: -12%;
        width: 680px;
        height: 680px;
        background: linear-gradient(
          135deg,
          rgba(255, 51, 102, 0.85),
          rgba(92, 58, 255, 0.36)
        );
        animation: b2 20s ease-in-out infinite;
      }
      @keyframes b1 {
        0% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(36px, 22px, 0);
        }
        100% {
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes b2 {
        0% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(-36px, -26px, 0);
        }
        100% {
          transform: translate3d(0, 0, 0);
        }
      }

      /* topbar / breadcrumbs */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 28px;
        background: linear-gradient(
          90deg,
          rgba(92, 58, 255, 0.03),
          rgba(0, 246, 255, 0.02)
        );
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 31;
      }
      .brand .logo {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: conic-gradient(
          from 0deg,
          var(--primary),
          var(--accent),
          var(--secondary)
        );
        box-shadow: 0 10px 30px rgba(92, 58, 255, 0.12);
        animation: spin 9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .brand h1 {
        font-size: 16px;
        margin: 0;
        font-weight: 800;
        letter-spacing: 0.6px;
      }
      .top-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .top-actions a {
        color: var(--muted);
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.012);
      }
      .top-actions a.cta {
        background: linear-gradient(90deg, var(--secondary), var(--primary));
        color: white;
        font-weight: 800;
      }

      /* main wrapper */
      .wrap {
        max-width: 1200px;
        margin: 22px auto;
        padding: 0 18px;
        position: relative;
        z-index: 10;
      }

      /* genre hero */
      .genre-hero {
        display: flex;
        gap: 18px;
        align-items: center;
        padding: 22px;
        border-radius: 12px;
        margin-bottom: 18px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: var(--shadow);
      }
      .genre-hero .left {
        flex: 1;
      }
      .genre-hero h2 {
        margin: 0;
        font-size: 28px;
        font-weight: 900;
      }
      .genre-hero p {
        margin: 8px 0 0 0;
        color: var(--muted);
      }
      .genre-hero .right {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      /* filter bar */
      .filters {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .filters .chip {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.02);
        color: var(--muted);
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.02);
      }
      .filters .chip.active {
        background: linear-gradient(90deg, var(--primary), var(--accent));
        color: white;
        border-color: rgba(92, 58, 255, 0.18);
        transform: translateY(-3px);
      }

      /* controls (sort/price) */
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-left: auto;
      }
      .select,
      .range {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.04);
        padding: 10px 12px;
        border-radius: 10px;
      }

      /* grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }
      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 820px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      /* product card */
      .card {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.01),
          rgba(255, 255, 255, 0.005)
        );
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.03);
        transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1),
          box-shadow 0.28s, opacity 0.2s;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        min-height: 320px;
      }
      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 40px 80px rgba(92, 58, 255, 0.12);
      }
      .card .thumb {
        height: 220px;
        overflow: hidden;
        display: block;
        background: #0e0e16;
      }
      .card .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.03);
        transition: transform 0.6s ease;
      }
      .card:hover .thumb img {
        transform: scale(1.12);
      }
      .card .body {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }
      .card .title {
        font-weight: 800;
        margin: 0;
      }
      .card .meta {
        color: var(--muted);
        font-size: 13px;
      }
      .price-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: auto;
      }
      .price-current {
        font-weight: 900;
        color: var(--accent);
      }
      .price-old {
        text-decoration: line-through;
        color: var(--muted);
        font-weight: 700;
        font-size: 13px;
      }

      /* badges */
      .badge {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 4;
        background: linear-gradient(90deg, var(--secondary), var(--primary));
        color: white;
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 12px;
      }

      /* quick actions on hover */
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .btn {
        border: 0;
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 800;
      }
      .btn.add {
        background: linear-gradient(90deg, var(--secondary), var(--primary));
        color: white;
        box-shadow: 0 14px 40px rgba(92, 58, 255, 0.08);
      }
      .btn.quick {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.04);
        color: var(--muted);
      }

      /* pagination */
      .pagination {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 22px;
      }
      .page-btn {
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.03);
        cursor: pointer;
      }

      /* quick view modal */
      .modal {
        position: fixed;
        inset: 0;
        display: none;
        z-index: 60;
        align-items: center;
        justify-content: center;
        background: linear-gradient(rgba(2, 2, 6, 0.6), rgba(0, 0, 0, 0.7));
      }
      .modal.show {
        display: flex;
      }
      .modal .panel {
        width: min(1000px, 94%);
        max-height: 90vh;
        border-radius: 12px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 420px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);
      }
      .modal .imgwrap {
        background: #0f0f15;
        min-height: 420px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .modal .info {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* little helpers */
      .kicker {
        display: inline-block;
        color: var(--accent);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(0, 246, 255, 0.03);
        padding: 8px 12px;
        border-radius: 999px;
      }
      .count {
        color: var(--muted);
      }

      /* small screens */
      @media (max-width: 720px) {
        .genre-hero {
          flex-direction: column;
          align-items: flex-start;
        }
        .controls {
          margin-left: 0;
        }
        .modal .panel {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-layer" aria-hidden>
      <div class="bg-blob b1"></div>
      <div class="bg-blob b2"></div>
    </div>

    <div class="topbar" role="banner">
      <div class="brand">
        <div class="logo" aria-hidden></div>
        <h1>ANIMAZE</h1>
      </div>
      <div class="top-actions">
        <a href="#" aria-label="Go home">Home</a>
        <a href="#" class="cta" aria-label="Sign in">Sign in</a>
      </div>
    </div>

    <main class="wrap" role="main">
      <!-- genre hero will adapt from URL ?genre=... -->
      <section class="genre-hero" id="genreHero">
        <div class="left">
          <div class="kicker" id="kicker">Genre</div>
          <h2 id="genreTitle">All Products</h2>
          <p id="genreDesc">
            Browse popular items from this genre — neon-themed, SSR-friendly
            markup.
          </p>
        </div>
        <div class="right">
          <div class="count" id="countDisplay">0 products</div>
        </div>
      </section>

      <!-- filters -->
      <div
        style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap"
      >
        <div class="filters" id="genreChips" aria-label="Genres">
            
        <button class="chip active" data-genre="">All</button><button class="chip" data-genre="Demon Slayer">Demon Slayer</button><button class="chip" data-genre="One Piece">One Piece</button><button class="chip" data-genre="Naruto">Naruto</button><button class="chip" data-genre="Dragon Ball">Dragon Ball</button><button class="chip" data-genre="Jujutsu Kaisen">Jujutsu Kaisen</button></div>
        </div>
      </div>

      <!-- products grid -->
      <section style="margin-top: 12px">
        <div class="grid" id="productGrid" aria-live="polite">
            <article class="card" tabindex="0">
      <div class="badge">-22%</div>
      <div class="thumb"><img loading="lazy" src="https://images.unsplash.com/photo-1618354691438-be0ecf671c7f?q=80&amp;w=1200&amp;auto=format&amp;fit=crop" alt="Demon Slayer — Tanjiro Figure"></div>
      <div class="body">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div>
            <div class="title">Demon Slayer — Tanjiro Figure</div>
            <div class="meta">Demon Slayer • 4.8★</div>
          </div>
          <div style="text-align:right">
            <div class="price-row">
              <div class="price-current">₹3,499</div>
            </div>
            <div class="price-old">₹4,499</div>
          </div>
        </div>

        <div class="actions" style="margin-top:12px">
          <button class="btn add" data-id="1">Add</button>
          <button class="btn quick" data-id="1">Quick View</button>
        </div>
      </div>
    </article>
        </div>
      </section>
    </main>
  
    <script>
      // ---------- demo product data ----------
      const products = [
        {
          id: 1,
          name: "Demon Slayer — Tanjiro Figure",
          price: 3499,
          oldPrice: 4499,
          rating: 4.8,
          genre: "Demon Slayer",
          image:
            "https://images.unsplash.com/photo-1618354691438-be0ecf671c7f?q=80&w=1200&auto=format&fit=crop",
          stock: 12,
          desc: "High-detail Tanjiro figure, PVC, 18cm.",
        },
        {
          id: 2,
          name: "One Piece — Luffy Tee",
          price: 1299,
          oldPrice: 1499,
          rating: 4.6,
          genre: "One Piece",
          image:
            "https://images.unsplash.com/photo-1608889335941-55f329f96f5a?q=80&w=1200&auto=format&fit=crop",
          stock: 25,
          desc: "Oversized one-piece inspired tee.",
        },
        {
          id: 3,
          name: "Naruto — Hokage Hoodie",
          price: 1999,
          oldPrice: 2499,
          rating: 4.7,
          genre: "Naruto",
          image:
            "https://images.unsplash.com/photo-1606117331085-5760fe8c9b80?q=80&w=1200&auto=format&fit=crop",
          stock: 8,
          desc: "Premium hoodie with neon print.",
        },
        {
          id: 4,
          name: "Dragon Ball — Goku Statue",
          price: 3699,
          oldPrice: 4499,
          rating: 4.5,
          genre: "Dragon Ball",
          image:
            "https://images.unsplash.com/photo-1603252109303-2751441dd157?q=80&w=1200&auto=format&fit=crop",
          stock: 3,
          desc: "Limited collectible statue.",
        },
        {
          id: 5,
          name: "Jujutsu Kaisen — Poster Set",
          price: 799,
          oldPrice: 999,
          rating: 4.4,
          genre: "Jujutsu Kaisen",
          image:
            "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop",
          stock: 48,
          desc: "Set of premium matte posters.",
        },
        {
          id: 6,
          name: "Naruto — Kakashi Figure",
          price: 2999,
          oldPrice: 3499,
          rating: 4.6,
          genre: "Naruto",
          image:
            "https://images.unsplash.com/photo-1519669556873-8a06fbecdf2f?q=80&w=1200&auto=format&fit=crop",
          stock: 6,
          desc: "Detailed Kakashi PVC figure.",
        },
        {
          id: 7,
          name: "One Piece — Zoro Sword Keychain",
          price: 399,
          oldPrice: 599,
          rating: 4.3,
          genre: "One Piece",
          image:
            "https://images.unsplash.com/photo-1558980394-0c2f40a28b4a?q=80&w=1200&auto=format&fit=crop",
          stock: 120,
          desc: "Metal keychain with miniature katana.",
        },
        {
          id: 8,
          name: "Demon Slayer — Nezuko Figure",
          price: 2799,
          oldPrice: 3499,
          rating: 4.7,
          genre: "Demon Slayer",
          image:
            "https://images.unsplash.com/photo-1609698594270-40f3d0de1c5b?q=80&w=1200&auto=format&fit=crop",
          stock: 15,
          desc: "Nezuko collectible figure, limited run.",
        },
        {
          id: 9,
          name: "Dragon Ball — Vegeta Tee",
          price: 999,
          oldPrice: 1299,
          rating: 4.2,
          genre: "Dragon Ball",
          image:
            "https://images.unsplash.com/photo-1562158070-1b4a9b3de2df?q=80&w=1200&auto=format&fit=crop",
          stock: 40,
          desc: "Retro Vegeta tee.",
        },
        {
          id: 10,
          name: "Jujutsu Kaisen — Sukuna Pin",
          price: 299,
          oldPrice: 399,
          rating: 4.1,
          genre: "Jujutsu Kaisen",
          image:
            "https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=1200&auto=format&fit=crop",
          stock: 210,
          desc: "Collectible enamel pin.",
        },
      ];

      // ---------- UI state ----------
      let state = {
        genre: null, // current genre filter
        sort: "featured",
        minRating: 0,
        page: 1,
        perPage: 8,
        filtered: products.slice(),
      };

      // ---------- utilities ----------
      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => Array.from(document.querySelectorAll(sel));
      function money(n) {
        return "₹" + n.toLocaleString("en-IN");
      }

      // --- initial setup: populate genres chips ---
      const genreSet = [
        "All",
        ...Array.from(new Set(products.map((p) => p.genre))),
      ];
      const chipsEl = $("#genreChips");
      genreSet.forEach((g) => {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = g;
        chip.dataset.genre = g === "All" ? "" : g;
        chip.addEventListener("click", () => {
          setGenre(chip.dataset.genre || null);
          // update URL so you can link to ?genre=...
          const params = new URLSearchParams(window.location.search);
          if (chip.dataset.genre) params.set("genre", chip.dataset.genre);
          else params.delete("genre");
          history.replaceState(
            null,
            "",
            window.location.pathname +
              (params.toString() ? "?" + params.toString() : "")
          );
        });
        chipsEl.appendChild(chip);
      });

      // read genre from url param ?genre=...
      const urlParams = new URLSearchParams(window.location.search);
      const initialGenre = urlParams.get("genre");
      if (initialGenre) setGenre(initialGenre);
      else setGenre(null);

      // initial sort/rating control binding
      $("#sort").addEventListener("change", (e) => {
        state.sort = e.target.value;
        state.page = 1;
        applyFilters();
      });
      $("#ratingFilter").addEventListener("change", (e) => {
        state.minRating = parseFloat(e.target.value);
        state.page = 1;
        applyFilters();
      });
      $("#clearFilters").addEventListener("click", () => {
        state.sort = "featured";
        state.minRating = 0;
        state.page = 1;
        setGenre(null);
        $("#sort").value = "featured";
        $("#ratingFilter").value = "0";
        applyFilters();
      });

      // set genre function
      function setGenre(name) {
        state.genre = name || null;
        // highlight chip
        $$(".chip").forEach((c) =>
          c.classList.toggle("active", (c.dataset.genre || "") === (name || ""))
        );
        // update hero
        $("#genreTitle").textContent = name ? name : "All Products";
        $("#kicker").textContent = name ? name.toUpperCase() : "ALL";
        $("#genreDesc").textContent = name
          ? `Showing products in "${name}".`
          : "Browse everything — use filters to narrow results.";
        state.page = 1;
        applyFilters();
      }

      // apply filters + sort + pagination
      function applyFilters() {
        let list = products.slice();
        if (state.genre) list = list.filter((p) => p.genre === state.genre);
        if (state.minRating)
          list = list.filter((p) => p.rating >= state.minRating);

        // sort
        if (state.sort === "price-asc") list.sort((a, b) => a.price - b.price);
        else if (state.sort === "price-desc")
          list.sort((a, b) => b.price - a.price);
        else if (state.sort === "rating-desc")
          list.sort((a, b) => b.rating - a.rating);
        else if (state.sort === "newest") list.sort((a, b) => b.id - a.id);
        // else featured => keep original order

        state.filtered = list;
        renderGrid();
        renderPagination();
        $("#countDisplay").textContent = `${list.length} product${
          list.length === 1 ? "" : "s"
        }`;
      }

      // render grid
      function renderGrid() {
        const grid = $("#productGrid");
        grid.innerHTML = "";
        const start = (state.page - 1) * state.perPage;
        const pageItems = state.filtered.slice(start, start + state.perPage);

        pageItems.forEach((p) => {
          const card = document.createElement("article");
          card.className = "card";
          card.tabIndex = 0;
          card.innerHTML = `
      ${
        p.oldPrice && p.oldPrice > p.price
          ? `<div class="badge">-${Math.round(
              (1 - p.price / p.oldPrice) * 100
            )}%</div>`
          : ""
      }
      <div class="thumb"><img loading="lazy" src="${p.image}" alt="${
            p.name
          }"></div>
      <div class="body">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div>
            <div class="title">${p.name}</div>
            <div class="meta">${p.genre} • ${p.rating}★</div>
          </div>
          <div style="text-align:right">
            <div class="price-row">
              <div class="price-current">${money(p.price)}</div>
            </div>
            ${
              p.oldPrice && p.oldPrice > p.price
                ? `<div class="price-old">${money(p.oldPrice)}</div>`
                : ""
            }
          </div>
        </div>

        <div class="actions" style="margin-top:12px">
          <button class="btn add" data-id="${p.id}">Add</button>
          <button class="btn quick" data-id="${p.id}">Quick View</button>
        </div>
      </div>
    `;
          // interactions
          card.querySelector(".quick").addEventListener("click", (e) => {
            e.stopPropagation();
            openModal(p.id);
          });
          card.querySelector(".add").addEventListener("click", (e) => {
            e.stopPropagation();
            addToCart(p.id);
          });
          // whole card click opens quickview
          card.addEventListener("click", () => openModal(p.id));
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter") openModal(p.id);
          });
          grid.appendChild(card);
        });

        if (pageItems.length === 0) {
          grid.innerHTML = `<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)">No products found — try clearing filters.</div>`;
        }
      }

      // pagination
      function renderPagination() {
        const pag = $("#pagination");
        pag.innerHTML = "";
        const total = Math.ceil(state.filtered.length / state.perPage) || 1;
        // show previous / pages / next
        const prev = document.createElement("button");
        prev.className = "page-btn";
        prev.textContent = "‹ Prev";
        prev.disabled = state.page === 1;
        prev.addEventListener("click", () => {
          state.page = Math.max(1, state.page - 1);
          renderGrid();
          renderPagination();
        });
        pag.appendChild(prev);

        // pages (limit to 7 visible)
        const maxVisible = 7;
        let start = Math.max(1, state.page - 3);
        let end = Math.min(total, start + maxVisible - 1);
        if (end - start + 1 < maxVisible)
          start = Math.max(1, end - maxVisible + 1);
        for (let i = start; i <= end; i++) {
          const b = document.createElement("button");
          b.className = "page-btn";
          b.textContent = i;
          if (i === state.page) b.style.fontWeight = "900";
          b.addEventListener("click", () => {
            state.page = i;
            renderGrid();
            renderPagination();
          });
          pag.appendChild(b);
        }

        const next = document.createElement("button");
        next.className = "page-btn";
        next.textContent = "Next ›";
        next.disabled = state.page === total;
        next.addEventListener("click", () => {
          state.page = Math.min(total, state.page + 1);
          renderGrid();
          renderPagination();
        });
        pag.appendChild(next);
      }

      // open quick view modal
      const modal = $("#modal");
      function openModal(id) {
        const p = products.find((x) => x.id === id);
        if (!p) return;
        $("#modalImg").src = p.image;
        $("#modalTitle").textContent = p.name;
        $("#modalKicker").textContent = p.genre;
        $("#modalDesc").textContent = p.desc;
        $("#modalPrice").textContent = money(p.price);
        $("#modalOld").textContent =
          p.oldPrice && p.oldPrice > p.price ? money(p.oldPrice) : "";
        $("#modalStock").textContent =
          p.stock > 0 ? "In stock" : "Out of stock";
        modal.classList.add("show");
        modal.setAttribute("aria-hidden", "false");
        // trap scroll
        document.body.style.overflow = "hidden";
      }

      $("#modalClose").addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
      function closeModal() {
        modal.classList.remove("show");
        modal.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      // demo add to cart
      function addToCart(id) {
        const p = products.find((x) => x.id === id);
        if (!p) return;
        alert(`Added to cart — ${p.name} (${money(p.price)})`);
      }

      // initial render
      applyFilters();

      // small UX: if user lands from ?genre=NAME -> highlight that chip
      (function highlightInitialFromURL() {
        const params = new URLSearchParams(window.location.search);
        const g = params.get("genre");
        if (!g) return;
        const chip = $$(".chip").find((c) => (c.dataset.genre || "") === g);
        if (chip) chip.classList.add("active");
      })();
    </script>
  </body>
</html>
