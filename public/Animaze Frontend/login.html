<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Animaze — Login</title>
    <style>
      :root {
        --bg: #0c0c1e;
        --panel: #141426;
        --muted: #bdbbd1;
        --text: #f5f5f7;
        --primary: #5c3aff;
        --secondary: #ff3366;
        --accent: #00f6ff;
        --radius: 14px;
        --glass: rgba(255, 255, 255, 0.03);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(
            800px 300px at 10% -10%,
            rgba(92, 58, 255, 0.06),
            transparent
          ),
          radial-gradient(
            700px 250px at 110% 0%,
            rgba(0, 246, 255, 0.03),
            transparent
          ),
          var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      /* moving background layers for continuity */
      .bg-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .bg-blob {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.18;
        mix-blend-mode: screen;
      }
      .b1 {
        left: -12%;
        top: -8%;
        background: linear-gradient(
          135deg,
          rgba(92, 58, 255, 0.95),
          rgba(0, 246, 255, 0.6)
        );
        animation: blobMove1 14s ease-in-out infinite;
      }
      .b2 {
        right: -15%;
        bottom: -10%;
        width: 620px;
        height: 620px;
        background: linear-gradient(
          135deg,
          rgba(255, 51, 102, 0.85),
          rgba(92, 58, 255, 0.35)
        );
        animation: blobMove2 18s ease-in-out infinite;
      }
      .bg-lines {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px
        );
        background-size: 100px 100px;
        mix-blend-mode: overlay;
        opacity: 0.02;
        transform: translateZ(0);
        animation: lines 40s linear infinite;
      }

      @keyframes blobMove1 {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(40px, 30px, 0) scale(1.08);
        }
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
      }
      @keyframes blobMove2 {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(-40px, -26px, 0) scale(1.06);
        }
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
      }
      @keyframes lines {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 4000px 0;
        }
      }

      /* card */
      .card {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 820px;
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 20px;
        padding: 28px;
        border-radius: 16px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: 0 30px 60px rgba(92, 58, 255, 0.06);
      }

      .left {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        background: conic-gradient(
          from 0deg,
          var(--primary),
          var(--accent),
          var(--secondary)
        );
        box-shadow: 0 10px 30px rgba(92, 58, 255, 0.12);
        animation: spin 9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .brand h2 {
        margin: 0;
        font-size: 18px;
      }

      .headline {
        font-size: 26px;
        font-weight: 800;
      }
      .sub {
        color: var(--muted);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .input {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.04);
        padding: 12px;
        border-radius: 10px;
        color: var(--text);
        outline: none;
      }
      .input:focus {
        border-color: rgba(92, 58, 255, 0.6);
        box-shadow: 0 6px 30px rgba(92, 58, 255, 0.06);
      }

      .row {
        display: flex;
        gap: 8px;
      }
      .btn {
        border: 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: linear-gradient(90deg, var(--secondary), var(--primary));
        color: white;
        font-weight: 800;
        cursor: pointer;
      }
      .ghost {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.04);
        padding: 10px;
        border-radius: 10px;
        color: var(--muted);
      }

      .right {
        padding: 16px;
        border-radius: 12px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          transparent
        );
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        justify-content: center;
      }
      .right img {
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
        transform-origin: center;
        transition: transform 0.35s ease;
      }
      .right:hover img {
        transform: scale(1.03);
      }

      .note {
        font-size: 13px;
        color: var(--muted);
      }

      .helper {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .remember {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .error {
        color: #ff6b6b;
        font-weight: 700;
      }
      .success {
        color: #7ef0c7;
        font-weight: 700;
      }

      @media (max-width: 900px) {
        .card {
          grid-template-columns: 1fr;
          padding: 18px;
        }
        .right {
          order: 2;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-layer" aria-hidden>
      <div class="bg-blob b1"></div>
      <div class="bg-blob b2"></div>
      <div class="bg-lines"></div>
    </div>

    <div class="card" role="main">
      <div class="left">
        <div class="brand">
          <div class="logo" aria-hidden></div>
          <h2>ANIMAZE</h2>
        </div>
        <div>
          <div class="headline">Welcome back</div>
          <div class="sub">
            Sign in to access your wishlist, order history and leave reviews.
          </div>
        </div>

        <form id="loginForm" autocomplete="on">
          <input
            id="email"
            class="input"
            type="email"
            placeholder="Email address"
            required
          />
          <div class="row">
            <input
              id="password"
              class="input"
              type="password"
              placeholder="Password"
              required
            />
            <button
              type="button"
              id="togglePwd"
              class="ghost"
              aria-label="Show password"
            >
              Show
            </button>
          </div>

          <div class="helper">
            <label class="remember"
              ><input id="remember" type="checkbox" /> Remember me</label
            >
            <a
              href="#"
              id="forgot"
              style="color: var(--muted); text-decoration: none"
              >Forgot?</a
            >
          </div>
          /home/ekalabya-23/Desktop/Animaze SSR/public/js/product.js

          <div style="display: flex; gap: 10px; align-items: center">
            <button class="btn" type="submit">Sign In</button>
            <button type="button" id="demoBtn" class="ghost">Demo login</button>
          </div>

          <div id="msg" aria-live="polite"></div>
        </form>

        <div style="margin-top: 8px; color: var(--muted)">
          Don't have an account?
          <a
            href="signup.html"
            style="color: var(--accent); text-decoration: none"
            >Create one</a
          >
        </div>
      </div>

      <div class="right">
        <img
          src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=900&auto=format&fit=crop"
          alt="neon arcade"
        />
        <div class="note">
          Tip: Use demo login while testing — works locally without backend.
        </div>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const msg = document.getElementById("msg");
      const toggle = document.getElementById("togglePwd");
      const pwd = document.getElementById("password");
      const demoBtn = document.getElementById("demoBtn");

      toggle.addEventListener("click", () => {
        if (pwd.type === "password") {
          pwd.type = "text";
          toggle.textContent = "Hide";
        } else {
          pwd.type = "password";
          toggle.textContent = "Show";
        }
      });

      // simple demo credentials loader
      demoBtn.addEventListener("click", () => {
        document.getElementById("email").value = "demo@animaze.test";
        pwd.value = "password123";
        msg.innerHTML =
          '<div class="note">Filled demo credentials — press Sign In</div>';
      });

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = pwd.value;

        // check localStorage "animaze_users" (from signup demo)
        const users = JSON.parse(localStorage.getItem("animaze_users") || "[]");
        const found = users.find(
          (u) => u.email && u.email.toLowerCase() === email.toLowerCase()
        );
        if (!found) {
          // allow demo account
          if (email === "demo@animaze.test" && password === "password123") {
            onSuccess({ first: "Demo", last: "User", email });
            return;
          }
          msg.innerHTML =
            '<div class="error">No account found for this email.</div>';
          return;
        }
        // since we didn't store passwords in demo signup, accept any password for matched email
        onSuccess(found);
      });

      function onSuccess(user) {
        msg.innerHTML =
          '<div class="success">Signed in — Welcome ' +
          (user.first || "") +
          "!</div>";
        // set simple session in localStorage
        localStorage.setItem(
          "animaze_session",
          JSON.stringify({ email: user.email, name: user.first || "" })
        );
        setTimeout(() => (location.href = "product.html"), 900);
      }
    </script>
  </body>
</html>
